<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Zadanie 45</title>
    </head>

    <body>
        <div style="color:red;font-size:30px;">
            <script language="JavaScript">
                var koniec_petli_roh = parseInt(prompt("Podaj liczbę końcową:", ""));
                document.write("Liczby parzyste od 1 do " + koniec_petli_roh + ":<br>");
                for (i_roh = 2; i_roh <= koniec_petli_roh; i_roh += 2) {
                    document.write(i_roh + "<br>");
                }
            </script>
        </div>
    </body>
</html>
