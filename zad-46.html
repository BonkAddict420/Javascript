<html>
    <body>
        <div style="color: red; font-size: 42px;">

        <script language="JavaScript">
            var i_roh = parseFloat(prompt("Liczba=", ""))

            if (i_roh % 2 == 0) {
                for (i = 1; i <= 11; i++) {
                    document.write("Rohde<br>")
                }
            } else {
                for (i = 1; i <= 11; i++) {
                    document.write("Adam<br>")
                }
            }
        </script>
    </body>
</html>
