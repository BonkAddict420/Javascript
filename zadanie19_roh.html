<html>
<head>
    <meta charset="UTF-8">
</head>

<body>
    <script type="text/javascript">
        function pole_roh() {
            var a_roh = parseFloat(document.getElementById('dlugosc').value);
            var b_roh = a_roh * a_roh;
            document.getElementById("nazwa").innerHTML = "Pole kwadratu= " + b_roh.toFixed(2) + " cm^2";
        }
        function obwod_roh() {
            var a_roh = parseFloat(document.getElementById('dlugosc').value);
            var b_roh = 4 * a_roh;
            document.getElementById("nazwa").innerHTML = "Obwód kwadratu= " + b_roh.toFixed(2) + " cm";
        } 
    </script>
    <h1>Wszystko o KWADRACIE</h1><br><br>
    Podaj długość boku: <input type="text" id="dlugosc" value="podaj długość"> cm<br><br><br>
    <input type="button" name="pole" value="Oblicz pole" Onclick="pole_roh()"><br><br>
    <input type="button" name="obwod" value="Oblicz obwod" Onclick="obwod_roh()"><br><br>
    <div style="color:red;font-size:50px;" id="nazwa"></div>
</body>
</html>
