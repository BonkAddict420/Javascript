<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <script type="text/javascript">

        var Mebel = {
            rodzaj: "krzesło",
            material: "drewno",
            kolor: "brązowy",

            Mebel_wyswietl_rohde: function () {
                document.write("Nazwa obiektu: Mebel<br>");
                document.write("Pola w obiekcie: rodzaj, material, kolor<br>");
                document.write("Metoda w obiekcie: Mebel_wyswietl_rohde<br><br>");
            }
        };

        Mebel.cena = 350;

        Mebel.Mebel_pokaz_rohde = function () {
            document.write("Nowe pole poza ciałem obiektu: cena<br>");
            document.write("Nowa metoda poza ciałem obiektu: Mebel_pokaz_rohde<br><br>");
            document.write("Wartość pola cena: " + this.cena + " zł<br>");
        };

        Mebel.Mebel_wyswietl_rohde();
        Mebel.Mebel_pokaz_rohde();
    </script>
</head>
</html>
