<!DOCTYPE html>
<html lang="pl-PL">

<head>
    <meta charset="UTF-8">
    <title>Rohde Z36_JS</title>
</head>

<body>
    <script>
        var x = prompt("Podaj liczbę:", "");
        var a_dana_roh = parseInt(x);

        document.write("Wczytana liczba = " + a_dana_roh + "<br>");

        if (a_dana_roh % 2 == 0) {
            document.write("<font color=red size=3>liczba jest parzysta</font>");
        }

        if (a_dana_roh % 2 != 0) {
            document.write("<font color=silver size=5>liczba jest nieparzysta</font>");
        }
    </script>
</body>
</html>
