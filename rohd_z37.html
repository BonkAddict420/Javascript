<!DOCTYPE html>
<html lang="pl-PL">

<head>
    <meta charset="UTF-8">
    <title>Rohde Z37_JS</title>
</head>

<body>
    <script>
        var rok = prompt("Podaj rok, od którego działa JavaScript:", "");
        var rok_roh = parseInt(rok);

        document.write("Wczytany rok = " + rok_roh + "<br>");

        if (rok_roh == 1995) {
            document.write("<font color=blue size=4>Brawo, znasz rok od kiedy działa JavaScript</font>");
        }
        else {
            document.write("<font color=red size=7>Źle, musisz jeszcze poczytać</font>");
        }
    </script>
</body>
</html>
