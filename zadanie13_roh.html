<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <div style="color:green; font-size:55px;">
        <script language="JavaScript">
            var m_roh = prompt("Podaj wartość m (m_roh) =", "");

            var m = parseFloat(m_roh);

            var m1 = m + 1;
            var m2 = m * (m + 1);

            document.write("Dla m = " + m + "<br>");
            document.write("Rozkład ułamka egipskiego: <br>");
            document.write("1/" + m + " = 1/" + m1 + " + 1/" + m2 + "<br><br>");
        </script>
    </div>
</body>
</html>
