<!DOCTYPE html>
<html lang="pl-PL">
    <head>
        <meta charset="UTF-8">
        <title>Rohde Z35_JS</title>
    </head>

    <body>
        <div style="color:red;font-size:50px;">
            <script>
                var x = prompt("podaj liczbę x=", "");
                var a_dana_roh = parseFloat(x);

                document.write("czytana liczba x=" + a_dana_roh + "<br>");

                if (a_dana_roh > 0) {
                    document.write("czytana liczba jest większa od 0<br>");
                }

                if (a_dana_roh == 0) {
                    document.write("czytana liczba jest równa 0<br>");
                }

                if (a_dana_roh < 0) {
                    document.write("czytana liczba jest mniejsza od 0<br>");
                }
            </script>
        </div>
    </body>
</html>
