<!DOCTYPE html>
<html lang="pl">
    <head>
        <title>Sprawdzenie danych Rohde</title>
        <meta charset="utf-8">
    </head>

    <body>
        <div style="color:red;font-size:50px;">
            <script language="JavaScript">
                do {
                    var liczba1 = prompt("wysokość=", "");
                    var h_roh = parseFloat(liczba1);
                }
                while (h_roh <= 0);
                do {
                    var liczba1 = prompt("podstawę=", "");
                    var a_roh = parseFloat(liczba1);
                }
                while (!(a_roh > 0));
                var Pole = a_roh * h_roh / 2;
                document.write("Pole=" + Pole.toFixed(2) + " cm^2" + "<br>");
            </script>
        </div>
    </body>
</html>
