<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zadanie 15 - Ułamek egipski (dwa takie same ułamki)</title>
</head>
<body>
    <div style="color:green; font-size:55px;">
        <script language="JavaScript">
            var m_roh = prompt("Podaj wartość m (m_roh) =", "");
            var m = parseFloat(m_roh);

            var mianownik = 2 * m;

            document.write("Dla m = " + m + "<br>");
            document.write("Rozkład ułamka egipskiego na dwa takie same składniki:<br>");
            document.write("1/" + m + " = 1/" + mianownik + " + 1/" + mianownik + "<br><br>");
        </script>
    </div>
</body>
</html>
