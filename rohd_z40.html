<!DOCTYPE html>
<html lang="pl-PL">
    <head>
        <meta charset="UTF-8">
        <title>Rohde Z40_JS</title>
    </head>

    <body>
        <div style="color:red;font-size:50px;">
            <script>
                var x = prompt("Podaj argument x=", "");
                var x_roh = parseFloat(x);

                document.write("Wykonał Adam Rohde<br>");
                document.write("czytany argument x=" + x_roh.toFixed(2) + "<br>");

                function f_roh(x_roh) {
                    if (x_roh >= 2) {
                        return 9;
                    } else if (x_roh >= 0 && x_roh < 2) {
                        return Math.pow(x_roh, 3) + 1;
                    } else if (x_roh > -2 && x_roh < 0) {
                        return Math.pow(x_roh + 1, 2);
                    } else if (x_roh <= -2) {
                        return 1;
                    }
                }

                document.write("f(" + x_roh.toFixed(2) + ") = " + f_roh(x_roh).toFixed(2) + "<br>");
            </script>
        </div>
    </body>
</html>
