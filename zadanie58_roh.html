<!DOCTYPE html>
<html lang="pl">
    <head>
        <meta charset="utf-8">
        <title>Zadanie 58</title>
    </head>

    <body>
        <div style="color:red;font-size:30px;">
            <script language="JavaScript">
                var count_roh = 0;
                for (i_roh = 0; i_roh <= 39; i_roh++) {
                    var w_roh = i_roh * i_roh + i_roh + 41;
                    document.write("i=" + i_roh + "<br>");
                    document.write("w(" + i_roh + ")=" + w_roh + "<br>");
                    count_roh++;
                }
            </script>
        </div>
    </body>
</html>
