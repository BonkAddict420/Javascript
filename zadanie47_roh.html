<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Zadanie 47</title>
    </head>

    <body>
        <script language="JavaScript">
            var ile_razy_roh = 11;
            var wielkosc_liter_roh = 42;
            document.write("<div style='font-size:20px;'>ilość wykonania pętli = " + ile_razy_roh + "</div>");
            document.write("<div style='font-size:20px;'>wielkość liter = " + wielkosc_liter_roh + "px</div>");
            var dana_roh = parseInt(prompt("Podaj liczbę:", ""));
            if (dana_roh % 2 == 0) {
                for (var i_roh = 1; i_roh <= ile_razy_roh; i_roh++) {
                    document.write("<div style='font-size:" + wielkosc_liter_roh + "px; color:blue;'>Rohde</div>");
                }
            } else {
                for (var i_roh = 1; i_roh <= ile_razy_roh; i_roh++) {
                    document.write("<div style='font-size:" + wielkosc_liter_roh + "px; color:green;'>Adam</div>");
                }
            }
        </script>
    </body>
</html>
