<!DOCTYPE html>
<html>
    <head>
        <title>Zadanie 50</title>
        <meta charset="utf-8">
    </head>

    <body>
        <div style="color:red;font-size:40px;">
            <script language="JavaScript">
                var suma_roh = 0;
                for (var i_roh = 1; i_roh <= 1000000; i_roh++) {
                    suma_roh = suma_roh + 1 / i_roh;
                }
                document.write("Suma szeregu harmonicznego od 1 do 1 000 000 = " + suma_roh.toFixed(6) + "<br>");
            </script>
        </div>
    </body>
</html>
