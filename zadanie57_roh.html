<!DOCTYPE html>
<html lang="pl">
    <head>
        <meta charset="utf-8">
        <title>Zadanie 57</title>
    </head>

    <body>
        <script language="JavaScript">
            var l1_t_roh;
            do {
                l1_t_roh = parseInt(prompt("Podaj pierwszą liczbę z przedziału <20,60>:", ""));
                if (l1_t_roh < 20 || l1_t_roh > 60)
                    document.write("liczba " + l1_t_roh + " nie należy do przedziału &lt;20,60&gt;<br>");
            } while (l1_t_roh < 20 || l1_t_roh > 60);

            var l2_t_roh;
            do {
                l2_t_roh = parseInt(prompt("Podaj drugą liczbę z przedziału <20,60>:", ""));
                if (l2_t_roh < 20 || l2_t_roh > 60)
                    document.write("liczba " + l2_t_roh + " nie należy do przedziału &lt;20,60&gt;<br>");
            } while (l2_t_roh < 20 || l2_t_roh > 60);

            var pocz_roh = parseInt(prompt("Podaj wartość początkową wielkości tekstu (px):", ""));
            var tekst_roh = prompt("Podaj dowolny tekst:", "");

            if (l1_t_roh < l2_t_roh) {
                for (var i_roh = pocz_roh; i_roh <= 100; i_roh += 5)
                    document.write("<p style=\"font-size:" + i_roh + "px; color: black;\"><br>" + tekst_roh + "<br></p>");
            }
            else if (l2_t_roh < l1_t_roh) {
                for (var i_roh = pocz_roh; i_roh >= 0; i_roh -= 5)
                    document.write("<p style=\"font-size:" + i_roh + "px; color: black;\"><br>" + tekst_roh + "<br></p>");
            }
            else {
                document.write("<p style=\"font-size:" + pocz_roh + "px; color: black;\"><br>" + tekst_roh + "<br></p>");
            }
        </script>
    </body>
</html>
