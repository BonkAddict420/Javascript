<!DOCTYPE html>
<html lang="pl">
    <head>
        <meta charset="utf-8">
        <title>Zadanie 53</title>
    </head>

    <body>
        <script language="JavaScript">
            var ile_razy_roh = parseInt(prompt("ile razy powtórzyć", ""));
            var tekst_roh = prompt("podaj twoje inicjały", "");
            for (i_roh = 1; i_roh <= ile_razy_roh; i_roh++) {
                for (k_roh = 1; k_roh <= i_roh; k_roh++) {
                    document.write("&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp");
                }
                document.write(i_roh + "_" + tekst_roh + "_" + i_roh + "<br>");
            }
        </script>
    </body>
</html>
