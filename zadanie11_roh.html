<html>
<body>
    <div style="color:green;font-size:50px;">
        <script language="JavaScript">
            var D1_roh = prompt("Data1=", "");
            var D2_roh = prompt("Data2=", "");
            var sekund;
            var a = parseFloat(D1_roh);
            var b = parseFloat(D2_roh);
            sekund = (a - b) * 24 * 60 * 60;
            document.write("Ilość sekund między dniami " + a + " i " + b + " = " + sekund + "<br>");
        </script>
    </div>
</body>
</html>
