<!DOCTYPE html>
<html lang="pl">
    <head>
        <meta charset="utf-8">
        <title>Przykład użycia pętli</title>
    </head>

    <body>
        <script language="JavaScript">
            document.write("<div style='font-size:2cm; color:red;'>Rohde</div>");
            document.write("<div style='font-size:5mm; color:blue;'>Temat: Wyprowadzanie liczb od 1 do 10 przesuniętych o jedną spację w prawo. Demonstracja pętli zagnieżdżonych.</div>");
            for (var i = 1; i <= 10; i++) {
                for (var k = 1; k <= i; k++) {
                    document.write("&nbsp");
                }
                document.write(i + "<br>");
            }
        </script>
    </body>
</html>
