<html>
    <body>
        <div style="color: red; font-size: 42px;">

        <script language="JavaScript">
            for (i = 0; i <= 11; i++) {
                document.write(i + " ");

                if (i % 2 == 0) {
                    document.write("Adam<br>");
                } else {
                    document.write("Rohde<br>");
                }
            }
        </script>
    </body>
</html>
